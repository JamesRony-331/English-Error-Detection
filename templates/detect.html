<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英文作文识别</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#172b3a;font:16px/1.65 system-ui,sans-serif}main{max-width:1180px;margin:40px auto;padding:0 24px}h1{margin:0;font-size:30px}h2{font-size:19px;margin:0 0 16px}.intro{color:#617080;margin:8px 0 24px}.toolbar,.card{background:white;border:1px solid #dce3ea;border-radius:12px;padding:22px}.toolbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}button{background:#156b62;color:white;border:0;border-radius:7px;padding:11px 22px;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.preview{min-height:330px;display:flex;align-items:center;justify-content:center;background:#f7f9fb;border-radius:8px;overflow:hidden}.preview img{max-width:100%;max-height:650px;object-fit:contain}textarea{width:100%;min-height:210px;resize:vertical;border:1px solid #dce3ea;border-radius:8px;padding:14px;font:16px/1.7 monospace;background:#fafbfd}.result{white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0;padding:16px;border:1px solid #dce3ea;border-radius:8px;min-height:100px}mark{background:#ffe0de;color:#9e2822;border-bottom:2px solid #d75e55;border-radius:3px}small,.muted{color:#617080}#status{margin:0 0 18px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:7px;border-bottom:1px solid #e5ebef}.tablewrap{overflow:auto;max-height:300px}#model{overflow-wrap:anywhere} @media(max-width:760px){.grid{grid-template-columns:1fr}main{margin:24px auto;padding:0 14px}}
.camera{margin-bottom:22px}.camera video{display:block;width:100%;max-height:440px;background:#172b3a;border-radius:8px;margin:14px 0}.camera-actions{display:flex;gap:12px;flex-wrap:wrap}.camera-note{color:#815513;background:#fff6df;padding:12px 16px;border-radius:8px}.secondary{background:#536879}[hidden]{display:none!important}</style></head><body><main>
<h1>英文作文识别</h1><p class="intro">上传图片，提取英文，再检查疑似错误词。</p>
<form id="form" class="toolbar"><label for="image">选择一张图片</label><input id="image" name="image" type="file" accept="image/*" required><button id="submit" type="submit">识别并检测</button><small>最大 12 MB · 本机处理</small></form>
<section class="card camera" aria-labelledby="camera-title">
<h2 id="camera-title">摄像头识别</h2>
<p class="camera-note">电脑摄像头可能因拍摄角度、透视变形或对焦问题产生识别误差，建议用手机正对作文拍照后上传。</p>
<div class="camera-actions"><button id="open-camera" type="button">打开摄像头</button><button id="capture" type="button" disabled>拍照并识别</button><button id="close-camera" type="button" class="secondary" disabled>关闭摄像头</button></div>
<video id="camera-video" autoplay playsinline muted hidden aria-label="摄像头实时预览"></video>
<small>将整张作文放入画面，保持光线充足、纸面平整。点击拍照后自动关闭摄像头并识别。</small>
</section>
<p id="status" role="status" aria-live="polite">请选择图片。首次检测需要加载模型。</p>
<div class="grid"><section class="card"><h2>图片预览</h2><div class="preview"><span id="placeholder" class="muted">图片将在这里显示</span><img id="preview" alt="上传图片预览" hidden></div></section>
<section class="card"><h2>OCR 识别文本</h2><textarea id="text" aria-label="OCR 识别文本" readonly placeholder="识别结果将在这里显示"></textarea><h2 style="margin-top:24px">错误检测结果</h2><p class="muted">红色标出模型预测的疑似错误词，悬停查看概率。OCR 误读可能影响检测结果。</p><div id="result" class="result">等待识别</div><div class="tablewrap"><table><thead><tr><th>疑似错误词</th><th>错误概率</th><th>词表状态</th></tr></thead><tbody id="errors"></tbody></table></div><small id="model"></small></section></div>
</main><script src="{{ url_for('static', filename='web_detect.js') }}"></script></body></html>
